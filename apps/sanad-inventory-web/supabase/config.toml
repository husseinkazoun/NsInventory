# Supabase CLI project config for Sanad Inventory.
# Local development conventions; no live project is linked yet.
# When connecting to a real Supabase project, run:
#   supabase link --project-ref <project-ref>

project_id = "sanad-inventory"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
enable_signup = false
enable_anonymous_sign_ins = false
