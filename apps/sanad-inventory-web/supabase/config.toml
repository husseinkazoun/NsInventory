# Supabase CLI project config for Sanad Inventory.
#
# Ports below are the LOCAL development stack (`supabase start`). A hosted
# project is already linked on the maintainer's machine; the link lives in
# `supabase/.temp/linked-project.json`, which is gitignored so the project ref
# is never committed. To link a fresh checkout:
#   supabase link --project-ref <project-ref>

project_id = "sanad-inventory"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
enable_signup = false
enable_anonymous_sign_ins = false

# Photo Scan endpoint. `verify_jwt = true` is the platform default, stated
# explicitly because the function's auth pattern depends on it: the platform
# rejects requests without a valid user JWT before the handler runs, and the
# handler then decides what that authenticated caller may reach. Do not deploy
# this function with --no-verify-jwt.
[functions.scan-process]
verify_jwt = true
