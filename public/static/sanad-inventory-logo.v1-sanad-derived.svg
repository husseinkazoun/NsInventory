<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanad Smart Inventory System">
  <!--
    Sanad-family inventory mark.
    - Rounded-square navy background and the swoosh + three dots are
      identical to ~/work/sanad/public/brand/sanad-logo.svg (Sanad
      family identity, unmodified).
    - The four scan-frame corner brackets are the only addition —
      they signify "inventory / inspection / scanning".
  -->
  <rect width="512" height="512" rx="77" ry="77" fill="#090E1A"/>

  <!-- Scan-frame corner brackets (subtle, frames the Sanad mark) -->
  <g stroke="#3C83F5" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M 60 100 L 60 60 L 100 60"/>
    <path d="M 412 60 L 452 60 L 452 100"/>
    <path d="M 100 452 L 60 452 L 60 412"/>
    <path d="M 452 412 L 452 452 L 412 452"/>
  </g>

  <!-- Sanad swoosh + ascending dots (unchanged from sanad-logo.svg) -->
  <g transform="translate(0, 20)">
    <path d="M 80 380 Q 140 380, 180 320 Q 240 240, 340 200 Q 400 180, 440 200"
          fill="none" stroke="#3C83F5" stroke-width="36" stroke-linecap="round"/>
    <circle cx="180" cy="260" r="34" fill="#3C83F5"/>
    <circle cx="280" cy="190" r="32" fill="#3C83F5"/>
    <circle cx="380" cy="150" r="30" fill="#3C83F5"/>
  </g>
</svg>
