name: Deploy inventory to VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "apps/sanad-inventory-web/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: nsinventory-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/nsinventory_deploy"
          chmod 600 "$HOME/.ssh/nsinventory_deploy"
          ssh-keyscan -T 15 -H "$VM_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Create production environment
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          public_host="${VM_HOST//./-}.sslip.io"
          umask 077
          {
            printf 'APP_NAME="Sanad Clothing Inventory"\n'
            printf 'APP_ENV=production\n'
            printf 'APP_KEY=%s\n' "$APP_KEY"
            printf 'APP_DEBUG=false\n'
            printf 'APP_URL=https://sanadinventory.com\n'
            printf 'LOG_CHANNEL=stderr\n'
            printf 'LOG_LEVEL=warning\n'
            printf 'DB_CONNECTION=mysql\n'
            printf 'DB_HOST=database\n'
            printf 'DB_PORT=3306\n'
            printf 'DB_DATABASE=nsinventory\n'
            printf 'DB_USERNAME=nsinventory\n'
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'BROADCAST_DRIVER=log\n'
            printf 'CACHE_DRIVER=file\n'
            printf 'FILESYSTEM_DISK=public\n'
            printf 'QUEUE_CONNECTION=sync\n'
            printf 'SESSION_DRIVER=file\n'
            printf 'SESSION_SECURE_COOKIE=true\n'
            printf 'MAIL_MAILER=log\n'
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_API_BASE=https://api.openai.com/v1\n'
            printf 'OPENAI_MODEL=gpt-4o\n'
            printf 'ADMIN_NAME="Sanad Inventory"\n'
            printf 'ADMIN_USERNAME=sanad-inventory\n'
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'PUBLIC_HOST=%s\n' "$public_host"
          } > "$RUNNER_TEMP/nsinventory.env"

      - name: Reclaim deployment space
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i "$HOME/.ssh/nsinventory_deploy" "$VM_USER@$VM_HOST" '
            set -eu
            docker container prune --force
            docker image prune --all --force
            docker builder prune --all --force --keep-storage 1GB

            current_release="$(readlink -f apps/nsinventory/current 2>/dev/null || true)"
            for candidate in apps/nsinventory/releases/*; do
              [ -d "$candidate" ] || continue
              candidate_path="$(readlink -f "$candidate")"
              if [ "$candidate_path" != "$current_release" ]; then
                rm -rf -- "$candidate"
              fi
            done
          '

      - name: Upload release
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          release="apps/nsinventory/releases/${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/nsinventory_deploy" "$VM_USER@$VM_HOST" "mkdir -p '$release'"
          tar --exclude=.git --exclude=.env --exclude=vendor --exclude=node_modules -czf - . \
            | ssh -i "$HOME/.ssh/nsinventory_deploy" "$VM_USER@$VM_HOST" "tar -xzf - -C '$release'"
          scp -i "$HOME/.ssh/nsinventory_deploy" "$RUNNER_TEMP/nsinventory.env" "$VM_USER@$VM_HOST:$release/.env"

      - name: Start production services
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          release="apps/nsinventory/releases/${GITHUB_SHA}"
          public_host="${VM_HOST//./-}.sslip.io"
          ssh -i "$HOME/.ssh/nsinventory_deploy" "$VM_USER@$VM_HOST" "
            set -eu
            cd '$release'
            # Trust ONLY the actual Docker network subnet Laravel sees as the
            # reverse-proxy source (Caddy), never '*'. Determined by inspecting
            # the live network, so it is never guessed and self-corrects if the
            # subnet ever changes. Falls back to the private Docker range only if
            # inspection fails (logged).
            subnet=\$(docker network inspect nsinventory_default --format '{{(index .IPAM.Config 0).Subnet}}' 2>/dev/null || true)
            if [ -z \"\$subnet\" ]; then subnet=172.16.0.0/12; echo \"WARN: docker subnet not found; using \$subnet\"; fi
            printf 'TRUSTED_PROXIES=%s\n' \"\$subnet\" >> .env
            echo \"Configured TRUSTED_PROXIES=\$subnet\"
            # Validate Compose + Caddy config BEFORE touching the running stack.
            # A syntax error aborts the deploy while the live proxy keeps running
            # the previous release, so a bad config can never crash-loop the
            # production web server (and its sslip.io fallback).
            docker compose --project-name nsinventory -f docker-compose.production.yml config -q
            docker run --rm -e PUBLIC_HOST='$public_host' \
              -v \"\$(pwd)/docker/Caddyfile:/etc/caddy/Caddyfile:ro\" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
            docker compose --project-name nsinventory -f docker-compose.production.yml up -d --build --remove-orphans
            cd ../..
            ln -sfn 'releases/${GITHUB_SHA}' current
          "

      - name: Verify deployment
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          origin_host="${VM_HOST//./-}.sslip.io"
          primary_host="sanadinventory.com"
          # Content marker, not just a 200: the old Cloudflare SPA returns 200 on
          # every path, so a status-code check would false-pass against it.
          laravel_marker="Sanad Clothing Inventory"

          # Mandatory gate: the VM origin must serve the Laravel app.
          origin_ok=""
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --location "https://${origin_host}/login" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q "$laravel_marker"; then
              echo "Origin OK: Laravel login served at https://${origin_host}/login"
              origin_ok=1
              break
            fi
            sleep 5
          done
          if [ -z "$origin_ok" ]; then
            echo "FATAL: VM origin did not serve the Laravel login page." >&2
            exit 1
          fi

          # Scheme gate: if TRUSTED_PROXIES is wrong, Laravel stops trusting
          # Caddy's X-Forwarded-Proto and treats the request as http, emitting
          # http:// form actions -> the login POST would hit the http->https
          # redirect and lose its body (silent login breakage). The content
          # check above still passes in that case, so gate explicitly on scheme.
          login_html="$(curl --fail --silent --show-error --location --max-time 20 "https://${origin_host}/login" 2>/dev/null || true)"
          if printf '%s' "$login_html" | grep -q 'action="https://'; then
            echo "Scheme OK: login form action is https on the origin"
          else
            echo "FATAL: login form action is not https (TRUSTED_PROXIES likely wrong); HTTPS URL generation regressed." >&2
            exit 1
          fi

          # Primary domain: verified once DNS is cut over to the VM. Non-fatal
          # before cutover so pre-cutover deploys still pass while the domain
          # still points at the old frontend.
          primary_body="$(curl --fail --silent --show-error --location --max-time 20 "https://${primary_host}/login" 2>/dev/null || true)"
          if printf '%s' "$primary_body" | grep -q "$laravel_marker"; then
            echo "Primary OK: Laravel login served at https://${primary_host}/login"
          else
            echo "NOTE: https://${primary_host}/login is not yet serving Laravel (expected before DNS cutover); VM-origin fallback verified."
          fi
